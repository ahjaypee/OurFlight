<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Upcoming Itinerary</h1>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="flight">✈️ Flights</button>
            <button class="filter-btn" data-filter="train">🚆 Trains</button>
            <button class="filter-btn" data-filter="car">🚗 Cars</button>
            <button class="filter-btn" data-filter="hotel">🏨 Hotels</button>
            <button class="filter-btn" data-filter="excursion">🍳 Excursions</button>
        </div>
    </header>
    
    <main id="itinerary-container">
        </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
