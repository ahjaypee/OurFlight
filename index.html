<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary</title>
    <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
    <header>
        <div id="trip-filter-container" class="filter-bar trip-bar" style="display: none;">
            </div>

        <div class="filter-bar">
            <button class="filter-btn category-btn" data-category="flight">Flights</button>
            <button class="filter-btn category-btn" data-category="train">Trains</button>
            <button class="filter-btn category-btn" data-category="car">Cars</button>
            <button class="filter-btn category-btn" data-category="hotel">Hotels</button>
            <button class="filter-btn category-btn" data-category="excursion">Excursions</button>
            <button class="filter-btn category-btn" data-category="hidden">Hidden</button>
        </div>

        <div class="filter-bar time-bar">
            <button class="filter-btn time-btn" data-time="today">Today</button>
            <button class="filter-btn time-btn" data-time="tomorrow">Tomorrow</button>
            <button class="filter-btn time-btn" data-time="dayafter">Day After</button>
        </div>
        
        <div id="countdown-banner" class="countdown-banner"></div>
    </header>
    
    <main id="itinerary-container">
        </main>

    <script src="app.js?v=26"></script>
</body>
</html>
